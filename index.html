<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CoPilote — Le pense-bête partagé</title>
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root { --bg:#F5F7F6; --card:#fff; --card-sub:#EBF2F0; --ink:#17302B; --mut:#5B706B; --line:#DCE4E1; --acc:#1F8A70; --acc-hover:#176B57; --soft:#E1F2EC; --ok:#2E9E6B; --warn:#D98A1F; --bad:#C94A3F; }
[data-theme="ocean"] { --bg:#F0F4F8; --card:#FFFFFF; --card-sub:#E2E8F0; --ink:#1E293B; --mut:#64748B; --line:#CBD5E1; --acc:#0284C7; --acc-hover:#0369A1; --soft:#E0F2FE; --ok:#10B981; --warn:#F59E0B; --bad:#EF4444; }
[data-theme="terracotta"] { --bg:#FAF7F5; --card:#FFFFFF; --card-sub:#F5ECE6; --ink:#3D2C2E; --mut:#8A7375; --line:#E6D5CC; --acc:#C85A32; --acc-hover:#A84522; --soft:#FAEDE6; --ok:#3B8262; --warn:#D97706; --bad:#DC2626; }
[data-theme="dark"] { --bg:#101917; --card:#17231F; --card-sub:#1F2E29; --ink:#E6F1EE; --mut:#97ADA7; --line:#2A3D38; --acc:#4FC3A1; --acc-hover:#3DB896; --soft:#1E3A32; --ok:#4FC3A1; --warn:#E8A94B; --bad:#E5695E; }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px;margin:0;font-weight:800;color:var(--acc)}
header .sub{margin:0;font-size:13px;color:var(--mut)}
main{max-width:720px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
button,select,input{font:inherit;color:var(--ink)}
nav button{flex:1 1 auto;padding:9px 5px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);white-space:nowrap}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.gs{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;margin-bottom:12px}
.g{text-align:center;background:var(--card-sub);border:1px solid var(--line);border-radius:14px;padding:10px 4px;transition:all 0.2s}
.g.drag-over{background:var(--soft);border-color:var(--acc);transform:scale(1.02)}
.g b{display:block;font-size:13px;font-weight:700;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:grab}
.row:active{cursor:grabbing}
.row.dragging{opacity:0.4}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.t p{margin:0;font-weight:600}.t small{color:var(--mut);font-size:12px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);background:none;cursor:pointer;flex:none;padding:0;color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform 0.2s}
.chk:active{transform:scale(1.2)}
.chk.d{background:var(--ok);border-color:var(--ok)}
.done p{text-decoration:line-through;color:var(--mut)}
.pill{font-size:12px;background:var(--soft);color:var(--acc);font-weight:600;border-radius:8px;padding:2px 9px;white-space:nowrap}
input,select{padding:8px 10px;border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:0}
.ed{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line);cursor:grab}
.ed.dragging{opacity:0.4}
.ed input{grid-column:1/-1}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--acc-hover)}
.btn-scan{background:#6366F1;border-color:#6366F1;color:#fff;padding:8px 12px;font-size:14px}
.lk{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;padding:4px;font-weight:600}
.add{display:grid;grid-template-columns:1fr 1fr;gap:6px}.add input{grid-column:1/-1}
.seg{flex:1;padding:9px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}.seg.on{background:var(--soft);border-color:var(--acc);color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:8px;background:var(--acc);border-radius:4px}
.sync-banner{font-size:12px;background:var(--card-sub);color:var(--ink);padding:8px 12px;border-radius:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.row.u-late{border-left:4px solid var(--bad);padding-left:8px}.row.u-today{border-left:4px solid var(--warn);padding-left:8px}.row.u-soon{border-left:4px solid var(--acc);padding-left:8px}
.al{border-left:4px solid var(--warn)}.al.bad{border-left-color:var(--bad)}.al.ok{border-left-color:var(--ok)}
.mut{color:var(--mut);font-size:13px}.lt{color:var(--bad);font-weight:700}.td{color:var(--warn);font-weight:700}
.g svg{display:block;margin:0 auto;width:100%;height:auto;max-width:84px}
.ai-loader{display:none;align-items:center;gap:8px;font-size:13px;color:#6366F1;font-weight:600;margin-top:10px}
.spinner{width:16px;height:16px;border:2px solid #6366F1;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.badge-tag { font-size: 11px; background: var(--soft); color: var(--acc); padding: 2px 6px; border-radius: 6px; font-weight: 600; }
.confetti { position: fixed; width: 10px; height: 10px; background-color: #f00; z-index: 9999; animation: fall 1s ease-out forwards; }
@keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(150px) rotate(360deg); opacity: 0; } }
.fr-overlay{position:fixed;inset:0;background:#101917;color:#E6F1EE;z-index:100;padding:24px;overflow-y:auto}
.fr-overlay h1{font-size:32px;margin:0 0 2px}.fr-overlay .sub{color:var(--mut);font-size:16px;margin:0 0 20px}
.fr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fr-card{background:#17231F;border:1px solid #2A3D38;border-radius:14px;padding:16px}
.fr-card h2{font-size:22px;margin:0;font-weight:700}
.fr-card ul{padding-left:20px;margin:8px 0 0}.fr-card li{font-size:18px;margin:4px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

</head>
<body>

<header>
  <div>
    <h1>CoPilote</h1>
    <p class="sub">Cette semaine, qui fait quoi et qui porte combien</p>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <select id="themeSelector" onchange="changeTheme(this.value)" style="padding:6px;font-size:12px;border-radius:8px">
      <option value="sauge">🌿 Sauge</option>
      <option value="ocean">🌊 Océan</option>
      <option value="terracotta">🧱 Terracotta</option>
      <option value="dark">🌙 Sombre</option>
    </select>
    <button class="btn" onclick="toggleFrigo(true)" style="padding:6px 10px;font-size:13px">📺 Mode Frigo</button>
  </div>
</header>

<main id="app"></main>
<input type="file" id="docFile" accept="image/*" capture="environment" style="display:none" onchange="onDocPhoto(this)">
<input type="file" id="barcodeFile" accept="image/*" capture="environment" style="display:none" onchange="onBarcodeScan(this)">

<div id="frigoView" class="fr-overlay" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1 id="frigoClock">00:00</h1>
      <p class="sub" id="frigoSub">CoPilote — Écran de cuisine</p>
      <p class="sub" id="wlState" style="font-size:13px;margin:-14px 0 16px"></p>
    </div>
    <button class="btn" onclick="toggleFrigo(false)">Quitter</button>
  </div>
  <div id="frigoContent" class="fr-grid"></div>
</div>

<script>
function changeTheme(themeName) {
  if (themeName === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else if (themeName === "sauge") {
    document.documentElement.removeAttribute("data-theme");
  } else {
    document.documentElement.setAttribute("data-theme", themeName);
  }
  try { localStorage.setItem("copilote-theme", themeName); } catch(e) {}
}

try {
  var savedTheme = localStorage.getItem("copilote-theme");
  if (savedTheme) {
    changeTheme(savedTheme);
    setTimeout(function() {
      var sel = document.getElementById("themeSelector");
      if (sel) sel.value = savedTheme;
    }, 50);
  }
} catch(e) {}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("./sw.js").catch(function(err) {});

}

function getKey() { try { return localStorage.getItem("copilote-openrouter-key") || ""; } catch(e) { return ""; } }

  var k = (window.prompt("Collez votre clé OpenRouter :", "") || "").trim();
  if (k && k.indexOf("sk-or-") === 0) { try { localStorage.setItem("copilote-openrouter-key", k); } catch(e) {} return k; }
  if (k) alert("Format de clé incorrect.");

var ID_RE = /^[A-Za-z0-9_-]{20,64}$/;
function newId() {
  var a = new Uint8Array(16), s = "f";
  (window.crypto || window.msCrypto).getRandomValues(a);
  for (var i = 0; i < a.length; i++) s += ("0" + a[i].toString(16)).slice(-2);

}

}

function clean(o) { return JSON.parse(JSON.stringify(o)); }
function ref(p) { return db.ref("foyers/" + FID + (p ? "/" + p : "")); }
function fail(e) { err = (e && e.code) || "erreur"; refresh(); }

function dT(id) { keep(); if (db) ref("tasks/" + id).remove().catch(fail); }

function wF(f) { keep(); if (db) ref("folders/" + f.id).set(clean(f)).catch(fail); }
function dF(id) { keep(); if (db) ref("folders/" + id).remove().catch(fail); }
